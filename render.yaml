services:
  - type: web
    name: morada-ehurafa
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node mock-server/server.mjs
    healthCheckPath: /api/properties
    envVars:
      - key: HOST
        value: 0.0.0.0
