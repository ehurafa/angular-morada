<a class="skip-link" href="#main-content" (click)="skipToContent($event)">
  Pular para o conteúdo
</a>

<router-outlet />

@if (availabilityStore.latestUpdate(); as update) {
  @if (dismissedUpdate() !== update) {
    <morada-property-availability-notice
      [update]="update"
      (dismissed)="dismissedUpdate.set(update)"
    />
  }
}
